syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "Protos/ms_vdapi_common_objects.proto";

option csharp_namespace = "MS.Vid_dldr.Manager.Protos.FromGeneric";

package ms_ms_vdapi;

service VdApiCallsForGeneric {
  
  rpc IsServiceUp (IsServiceUpRequest) returns (IsServiceUpResponse)  {
    option (google.api.http) = {
        get: "/v1/generic/isServiceUp/callerName/{caller_name}"
    };
  }
}

message IsServiceUpRequest {
  string caller_name = 1;
}

message IsServiceUpResponse {
    int32 is_up = 1;
    Feedback feedback = 2;
}